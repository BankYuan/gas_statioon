version: "3.8"

services:
  fastapi:
    image: gas-station-app:latest
    container_name: gas-station-fastapi
    env_file:
      - ./build/protected/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./license.json:/opt/app/license.json:ro           # 授权文件
      - /mnt/data1/Gas_station_video/mp4:/mnt/data1/Gas_station_video/mp4  # 本地切片目录
      - /var/log/gas_station:/var/log/gas_station         # 日志落地
    environment:
      - LOG_FILE=/var/log/gas_station/app.log
    ports:
      - "8010:8010"
    command: ["uvicorn", "app.main:app_", "--host", "0.0.0.0", "--port", "8010"]

  consumer:
    image: gas-station-app:latest
    container_name: gas-station-consumer
    env_file:
      - ./build/protected/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./license.json:/opt/app/license.json:ro
      - /mnt/data1/Gas_station_video/mp4:/mnt/data1/Gas_station_video/mp4
      - /var/log/gas_station:/var/log/gas_station
    environment:
      - LOG_FILE=/var/log/gas_station/consumer.log
    command: ["python", "scripts/consumer_worker.py"]

  redis:
    image: redis:latest
    container_name: gas-redis
    ports:
      - "6378:6379"
  
  postgres:
    image: postgres:15-alpine
    container_name: gas-postgres
    environment:
      POSTGRES_DB: video_db
      POSTGRES_USER: video_user
      POSTGRES_PASSWORD: "123456"
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_user -d video_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
  
  minio:
    image: minio/minio:latest
    container_name: gas-minio
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "19000:9000"
  
  # 如有算法服务或 ZLM 的镜像，可在下方补充（.env 中已预设服务名）
  zlm:
    image: zlmediakit/zlmediakit:master
    container_name: gas-zlm
    env_file:
      - ./build/protected/.env
    command: >
      /bin/sh -c "
        SECRET=$$(grep '^secret=' /opt/media/conf/config.ini | cut -d'=' -f2);
        if [ -z \"$$SECRET\" ]; then
          SECRET=$$(tr -dc A-Za-z0-9 </dev/urandom | head -c 32);
        fi;
        sed -i \"s/^secret=.*/secret=$$SECRET/\" /opt/media/conf/config.ini;
        sed -i '/^ZLM_SECRET=/d' /build/protected/.env || true;
        echo \"ZLM_SECRET=$$SECRET\" >> /build/protected/.env;
        exec ./MediaServer -s default"
    volumes:
      - ./build/protected/.env:/build/protected/.env
      - /mnt/data1/Gas_station_video/mp4:/opt/media/save_data/mp4
      - /mnt/data1/Gas_station_video/snapshot:/opt/media/save_data/snapshot
    ports:
      - "8080:80"
      - "1935:1935"
      - "8554:554"
      - "10000:10000"
      - "9000:9000/udp"
      - "8000:8000/udp"



volumes:
  minio-data:
